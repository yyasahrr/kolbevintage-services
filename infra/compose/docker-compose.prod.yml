# ─────────────────────────────────────────────────────────────────────────────
# محیط تولید کلبه (ParsPack Cloud Server).
#
# فاز ۱.۳ — بازبینی و اصلاح برای اثبات استقرار واقعی.
# این فایل روی میزبان دارای Docker باید با این دستور آزمایش شود:
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file infra/.env config
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file infra/.env up -d
#
# قاعدهٔ اجرا: مهاجرت‌ها **پیش از** بالا آمدن API اجرا می‌شوند؛ سرویس با اسکیمای
# قدیمی نباید ترافیک بگیرد.
#
#   backup → pull → migrate → restart → health checks → traffic verification
#
# نکته: worker (BullMQ) هنوز وجود ندارد — فاز ۶. فعلاً فقط api + storefront + nginx.
# ─────────────────────────────────────────────────────────────────────────────

name: kolbe

x-migrate-env: &migrate-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL لازم است}

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL لازم است}
  KOLBE_SESSION_SECRET: ${KOLBE_SESSION_SECRET:?KOLBE_SESSION_SECRET لازم است}
  KOLBE_ALLOWED_ORIGINS: ${KOLBE_ALLOWED_ORIGINS:?KOLBE_ALLOWED_ORIGINS لازم است}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT لازم است}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET لازم است}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY لازم است}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY لازم است}
  PORT: "4000"

x-storefront-env: &storefront-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL لازم است}
  KOLBE_SESSION_SECRET: ${KOLBE_SESSION_SECRET:?KOLBE_SESSION_SECRET لازم است}
  KOLBE_ALLOWED_ORIGINS: ${KOLBE_ALLOWED_ORIGINS:?KOLBE_ALLOWED_ORIGINS لازم است}
  PERFECT_CORP_API_KEY: ${PERFECT_CORP_API_KEY:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolbe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
      POSTGRES_DB: ${POSTGRES_DB:-kolbe}
    volumes:
      - kolbe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolbe} -d ${POSTGRES_DB:-kolbe}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # پورت منتشر نمی‌شود: دیتابیس فقط در شبکهٔ داخلی Compose دیده می‌شود.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kolbe-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    expose:
      - "6379"

  # اجرای مهاجرت‌ها به‌صورت یک job یک‌بارهٔ وابسته به سالم بودن دیتابیس.
  # فقط DATABASE_URL لازم دارد — S3 برای مهاجرت لازم نیست.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *migrate-env
    command: ["node", "packages/database/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"

  storefront:
    build:
      context: ../..
      dockerfile: infra/docker/storefront.Dockerfile
    restart: unless-stopped
    environment: *storefront-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/kolbe.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/kolbe-proxy-params.conf:/etc/nginx/kolbe-proxy-params.conf:ro
    depends_on:
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy
    # TLS با certbot/Let's Encrypt روی همین سرور اضافه می‌شود (گام جداگانهٔ عملیاتی).

volumes:
  kolbe-postgres:
  kolbe-redis:
