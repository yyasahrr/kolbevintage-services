# پیکربندی داخلی کانتینر استاتیک پورتال‌ها (SPA).
# مسیرها با Nginx اصلی (kolbe.conf) و پیشوند `/supplier` سرو می‌شوند، اما این
# کانتینر هم مستقل کار می‌کند تا در توسعه بتوان آن را جدا بالا آورد.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # دارایی‌های دارای هش محتوا: کش بلندمدت.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: هر مسیر ناشناخته به index.html برمی‌گردد.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
