# ═════════════════════════════════════════════════════════════════════════════
# Kolbe Vintage — پیکربندی Nginx
#
# این فایل **نقطهٔ کنترل مهاجرت (Strangler)** است (ADR-004):
# هر دامنه‌ای که در `apps/api` به هم‌ارزی می‌رسد، فقط با تغییر یک `location`
# از upstream قدیمی (`storefront`) به upstream جدید (`kolbe_api`) منتقل می‌شود و
# برگشت آن هم همان یک خط است. هیچ مرحله‌ای نیاز به توقف سرویس ندارد.
#
# قواعد حاکم بر این فایل:
#  - API همیشه زیر `/api/v1` است (نسخه‌بندی از روز اول).
#  - کوکی نشست HttpOnly است؛ پس هیچ‌جا نباید بدنهٔ پاسخ کش شود.
#  - مسیرهای احراز هویت محدودیت نرخ دارند (ضد Brute-force).
#  - liveness:  GET /healthz  → nginx خودش (بدون وابستگی به upstream)
#  - readiness: GET /api/v1/health و GET /api/health → وابسته به DB
#
# فاز ۱.۳: این فایل از نظر ایستا بازبینی و برای `nginx -t` آماده شد؛ اجرای واقعی
# روی میزبان دارای Docker باید تأیید شود.
# ═════════════════════════════════════════════════════════════════════════════

upstream kolbe_api {
    server api:4000;
    keepalive 32;
}

upstream kolbe_storefront {
    server storefront:3000;
    keepalive 32;
}

# ⚠️ پورتال‌های مستقل در فاز ۷ استخراج می‌شوند. امروز **هر دو** پورتال داخل
# اپلیکیشن Next.js سرو می‌شوند:
#   - تأمین‌کننده: `frontend-next/app/supplier/page.tsx` (بستهٔ `supplier-src`)
#   - مدیر: پنل داخل SPA فروشگاه (`/#/admin`)
# پس هر دو به upstream فروشگاه مسیر می‌شوند. اگر یکی از این upstreamها را
# همین حالا فعال کنیم، nginx به دلیل resolve نشدن نام میزبان **بالا نمی‌آید**؛
# و اگر بالا بیاید، پورتال فعال امروز را از کار می‌اندازد. هنگام استخراج پورتال
# در فاز ۷ باید سرویس متناظر به `compose/docker-compose.prod.yml` اضافه و این
# دو بلوک از حالت کامنت خارج شوند.
# upstream kolbe_supplier_portal { server supplier_portal:8080; keepalive 8; }
# upstream kolbe_admin_portal    { server admin_portal:8080;    keepalive 8; }

# هدر `Connection` باید بر اساس نوع درخواست تعیین شود؛ مقدار ثابت «upgrade» روی
# درخواست‌های معمولی هم ارسال می‌شود و اتصال keepalive را به upstream خراب می‌کند.
map $http_upgrade $kolbe_connection_upgrade {
    default upgrade;
    ""      close;
}

# محدودیت نرخ ورود: ۵ تلاش در دقیقه به‌ازای هر IP برای login.
limit_req_zone $binary_remote_addr zone=kolbe_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=kolbe_api:10m rate=300r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;   # آپلود ویدیوی سایت‌ساز (سقف سرور ۲۵ مگابایت است)
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── هدرهای امنیتی ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP سخت‌گیرانه در محیط توسعه وارد نشده است؛ پیش از تولید تنظیم شود
    # (تگ‌های درون‌خطی سایت‌ساز و ویدیوی Data-URL نیازمند بازبینی‌اند).

    # ── سلامت Nginx (liveness) — بدون وابستگی به upstream ───────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ── API نسخه‌دار (NestJS) ────────────────────────────────────────────────
    # محدودیت نرخ عمومی برای همهٔ /api/v1/*
    location /api/v1/ {
        limit_req zone=kolbe_api burst=60 nodelay;
        proxy_pass http://kolbe_api;
        include /etc/nginx/kolbe-proxy-params.conf;
    }

    # احراز هویت سقف جداگانه و سخت‌گیرانه دارد — بیرون از بلوک بالا تا nesting نداشته باشیم.
    location = /api/v1/auth/login {
        limit_req zone=kolbe_login burst=5 nodelay;
        proxy_pass http://kolbe_api;
        include /etc/nginx/kolbe-proxy-params.conf;
    }
    location /api/v1/auth/ {
        limit_req zone=kolbe_login burst=10 nodelay;
        proxy_pass http://kolbe_api;
        include /etc/nginx/kolbe-proxy-params.conf;
    }

    # ── مسیرهای گذار (زنده در handler قدیمی Next.js) ─────────────────────────
    # با منتقل شدن هر دامنه به NestJS، بلوک مربوطه حذف و از `/api/v1/` استفاده می‌شود.
    location /store/kolbe/ {
        proxy_pass http://kolbe_storefront;
        include /etc/nginx/kolbe-proxy-params.conf;
    }
    location /admin/kolbe/ {
        proxy_pass http://kolbe_storefront;
        include /etc/nginx/kolbe-proxy-params.conf;
    }

    # ── پورتال‌ها (امروز داخل فروشگاه Next.js سرو می‌شوند) ───────────────────
    # `location /supplier` نگه داشته می‌شود تا هنگام استخراج پورتال در فاز ۷ فقط
    # یک خط upstream عوض شود؛ مقصدش همان فروشگاه است.
    location /supplier {
        proxy_pass http://kolbe_storefront;
        include /etc/nginx/kolbe-proxy-params.conf;
    }

    # ── فروشگاه (پیش‌فرض) ────────────────────────────────────────────────────
    location / {
        proxy_pass http://kolbe_storefront;
        include /etc/nginx/kolbe-proxy-params.conf;
    }
}
