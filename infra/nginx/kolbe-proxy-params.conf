# پارامترهای مشترک proxy — در همهٔ locationها include می‌شود.
# نگهداری آن در یک فایل مانع واگرایی هدرها بین مسیرهای گذار و مسیرهای هدف می‌شود.
#
# فاز ۱.۳: اضافه شد `proxy_no_cache` و `proxy_cache_bypass` برای جلوگیری از کش
# پاسخ‌های دارای کوکی نشست (HttpOnly). همچنین `X-Request-ID` برای ردیابی.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
# مقدار از `map $http_upgrade $kolbe_connection_upgrade` در kolbe.conf می‌آید
proxy_set_header Connection $kolbe_connection_upgrade;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Correlation-ID $http_x_correlation_id;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# پاسخ‌های API هیچ‌گاه کش نمی‌شوند: بدنه ممکن است دادهٔ شخصی یا کوکی نشست داشته باشد.
proxy_buffering off;
proxy_request_buffering off;
proxy_no_cache 1;
proxy_cache_bypass 1;
